# TOTEM + Prospector dongle
# - totem_dongle_prospector : 동글 (ZMK Studio 포함, PC에 USB로 연결)
# - totem_left_peripheral / totem_right : 동글과 함께 쓰는 양쪽 반쪽
# - totem_left_no_dongle : 동글 없이 예전처럼 쓸 때 왼쪽용 (오른쪽은 totem_right 그대로)
---
include:
  - board: xiao_ble//zmk
    shield: totem_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n -DCONFIG_PROSPECTOR_FIXED_BRIGHTNESS=70 -DCONFIG_PROSPECTOR_MODIFIER_OS_WINDOWS=y -DCONFIG_LV_Z_VDB_SIZE=25
    artifact-name: totem_dongle_prospector
  - board: xiao_ble//zmk
    shield: totem_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: totem_left_peripheral
  - board: xiao_ble//zmk
    shield: totem_right
    artifact-name: totem_right
  - board: xiao_ble//zmk
    shield: totem_left
    snippet: studio-rpc-usb-uart
    artifact-name: totem_left_no_dongle
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: settings_reset
